<section class="mx-auto max-w-3xl px-4 pb-24 pt-10 sm:px-6">
  <header class="animate-fade-in">
    <p class="text-[11px] font-medium uppercase tracking-[0.3em] text-accent-400">ÑanduGrid</p>
    <h1 class="mt-2 font-display text-3xl font-semibold tracking-tight text-white sm:text-4xl">
      Subir foto
    </h1>
    <p class="mt-2 max-w-md text-sm leading-relaxed text-neutral-400">
      Elegí el propósito de tu foto y completá los detalles. Los datos EXIF se completan
      automáticamente.
    </p>
  </header>

  @if (step() === 1) {
    <div class="mt-8 animate-fade-in-up">
      <p class="text-[11px] uppercase tracking-[0.22em] text-neutral-500">Paso 1 · Propósito</p>
      <div class="mt-4 grid gap-4 sm:grid-cols-3">
        @for (option of purposes; track option.value) {
          <button
            type="button"
            (click)="selectPurpose(option.value)"
            class="group flex h-full flex-col rounded-3xl border border-ink-800 bg-ink-900 p-6 text-left transition hover:border-accent-500/60 hover:bg-accent-500/5"
          >
            <span
              class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/5 text-accent-300 transition group-hover:bg-accent-500/15"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path [attr.d]="option.icon" />
              </svg>
            </span>
            <h2 class="mt-4 font-display text-lg font-semibold text-white">{{ option.title }}</h2>
            <p class="mt-2 flex-1 text-sm leading-relaxed text-neutral-400">
              {{ option.description }}
            </p>
            <span
              class="mt-6 inline-flex items-center gap-1 text-[13px] font-medium text-accent-300 opacity-0 transition group-hover:opacity-100"
            >
              Seleccionar →
            </span>
          </button>
        }
      </div>
    </div>
  } @else {
    <div class="mt-8 grid animate-fade-in-up gap-6 lg:grid-cols-2">
      <div>
        <label
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave()"
          (drop)="onDrop($event)"
          [class]="
            isDragging()
              ? 'flex aspect-[4/3] cursor-pointer flex-col items-center justify-center overflow-hidden rounded-3xl border border-dashed border-accent-500 bg-accent-500/10 text-center'
              : 'flex aspect-[4/3] cursor-pointer flex-col items-center justify-center overflow-hidden rounded-3xl border border-dashed border-ink-700 bg-ink-900 text-center transition hover:border-accent-500/50'
          "
        >
          <input type="file" accept="image/*" class="sr-only" (change)="onFileInput($event)" />
          @if (previewUrl()) {
            <img [src]="previewUrl()" alt="Vista previa" class="h-full w-full object-cover" />
          } @else {
            <svg
              class="h-8 w-8 text-neutral-500"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 16V4M7 9l5-5 5 5M5 20h14" />
            </svg>
            <p class="mt-3 px-6 text-sm text-neutral-400">
              Arrastrá una imagen o hacé clic para elegir
            </p>
            <p class="mt-1 text-[11px] uppercase tracking-wider text-neutral-600">JPG · PNG · WebP</p>
          }
        </label>
        @if (previewUrl()) {
          <button
            type="button"
            (click)="clearImage()"
            class="mt-3 text-[13px] text-neutral-400 transition hover:text-white"
          >
            Quitar imagen
          </button>
        }
      </div>

      <div class="flex flex-col gap-4">
        <div>
          <label class="field-label" for="title">Título de la foto</label>
          <input
            id="title"
            type="text"
            placeholder="Ej: Valle al amanecer"
            [value]="title()"
            (input)="title.set($any($event.target).value)"
            class="input"
          />
        </div>

        <div>
          <label class="field-label" for="camera">Cámara</label>
          <input
            id="camera"
            type="text"
            [value]="camera()"
            (input)="camera.set($any($event.target).value)"
            class="input"
          />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="field-label" for="lens">Lente</label>
            <input
              id="lens"
              type="text"
              [value]="lens()"
              (input)="lens.set($any($event.target).value)"
              class="input"
            />
          </div>
          <div>
            <label class="field-label" for="iso">ISO</label>
            <input
              id="iso"
              type="number"
              min="50"
              max="12800"
              [value]="iso() ?? ''"
              (input)="iso.set($any($event.target).valueAsNumber || null)"
              class="input"
            />
          </div>
          <div>
            <label class="field-label" for="aperture">Apertura</label>
            <input
              id="aperture"
              type="text"
              placeholder="f/2.8"
              [value]="aperture()"
              (input)="aperture.set($any($event.target).value)"
              class="input"
            />
          </div>
          <div>
            <label class="field-label" for="shutter">Vel. obturación</label>
            <input
              id="shutter"
              type="text"
              placeholder="1/250"
              [value]="shutter()"
              (input)="shutter.set($any($event.target).value)"
              class="input"
            />
          </div>
        </div>

        @if (purpose() === 'commercial') {
          <div>
            <label class="field-label" for="price">Precio / Servicio asociado ($)</label>
            <input
              id="price"
              type="number"
              min="0"
              placeholder="Ej: 50000"
              [value]="price() ?? ''"
              (input)="price.set($any($event.target).valueAsNumber || null)"
              class="input"
            />
          </div>
        }

        <div class="mt-2 flex flex-wrap items-center gap-3">
          <button type="button" class="btn-accent" [disabled]="!canPublish()" (click)="publish()">
            Publicar Foto
          </button>
          <button type="button" class="btn-secondary" (click)="changePurpose()">
            Cambiar propósito
          </button>
        </div>
      </div>
    </div>
  }
</section>
